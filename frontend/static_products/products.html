<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Zootopia</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Poppins:400,600,700|Roboto:300,400,500,700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->
    <header class="main-header">
        <div class="header-logo" onclick="window.location.href='../static_homepage/index.html'">
            <img src="assets/newlogo.png" alt="Zootopia Logo">
        </div>
        <nav class="header-nav">
            <button class="nav-link" onclick="window.location.href='../static_homepage/index.html'">Home</button>
            <button class="nav-link" onclick="window.location.reload()">Products</button>
            <button class="nav-link">About Us</button>
        </nav>
        <button class="login-btn">Login</button>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <h1 class="page-title">Products</h1>

            <!-- Loading State (Optional, hidden by default if JS loads fast) -->
            <div id="loading" style="display: none; text-align: center; padding: 40px;">
                <i class="fas fa-spinner fa-spin" style="font-size: 40px; color: #980404;"></i>
            </div>

            <!-- Products Grid -->
            <div class="products-grid" id="productsGrid">
                <!-- Products will be injected here by script.js -->
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>


    <script src="script.js"></script>
</body>

</html>
