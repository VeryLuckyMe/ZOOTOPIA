<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        /* Embedding CSS directly or linking it if preferred */
    </style>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <!-- Admin Header -->
    <header class="admin-header">
        <div class="header-toolbar">
            <h6 class="header-title">Admin Panel</h6>
            <button class="nav-btn" onclick="location.href='dashboard.html'">Dashboard</button>
            <button class="nav-btn">Inventory</button>
            <button class="nav-btn">Appointments</button>
            <button class="nav-btn logout-btn">Logout</button>
        </div>
    </header>

    <!-- Page Content -->
    <div class="page-spacer">
        <div class="dashboard-container">
            <div class="welcome-section">
                <!-- Hardcoded admin name for demo -->
                <h1 class="welcome-title">Welcome, Admin!</h1>
                <p class="welcome-subtitle">This is a protected page only accessible to logged-in admins.</p>
            </div>

            <div class="metrics-grid">
                <!-- Total Orders -->
                <div class="metric-card">
                    <h2 class="metric-title">Total Orders</h2>
                    <p class="metric-value" id="orders-value">0</p>
                    <div class="metric-icon">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                </div>

                <!-- Total Products -->
                <div class="metric-card">
                    <h2 class="metric-title">Total Products</h2>
                    <p class="metric-value" id="products-value">0</p>
                    <div class="metric-icon">
                        <i class="fas fa-dolly-flatbed"></i>
                    </div>
                </div>

                <!-- Appointments -->
                <div class="metric-card">
                    <h2 class="metric-title">Appointments</h2>
                    <p class="metric-value" id="appointments-value">0</p>
                    <div class="metric-icon">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                </div>

                <!-- Products Sold -->
                <div class="metric-card">
                    <h2 class="metric-title">Products Sold</h2>
                    <p class="metric-value" id="sold-value">0</p>
                    <div class="metric-icon">
                        <i class="fas fa-tag"></i>
                    </div>
                </div>

                <!-- Total Reviews -->
                <div class="metric-card">
                    <h2 class="metric-title">Total Reviews</h2>
                    <p class="metric-value" id="reviews-value">0</p>
                    <div class="metric-icon">
                        <i class="fas fa-star"></i>
                    </div>
                </div>

                <!-- Income -->
                <div class="metric-card">
                    <h2 class="metric-title">Income</h2>
                    <p class="metric-value" id="income-value">$0</p>
                    <div class="metric-icon">
                        <i class="fas fa-dollar-sign"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Footer -->
    <footer class="admin-footer">
        <img src="assets/logo.png" alt="Tails & Whiskers Logo" class="footer-logo">
        <p class="footer-text">© All Rights Reserved</p>
        <div class="footer-contact">
            <p>Phone: +63 999 999 9999</p>
            <p>Address: Cebu, PH</p>
        </div>
    </footer>

    <script src="dashboard.js"></script>
</body>

</html>
